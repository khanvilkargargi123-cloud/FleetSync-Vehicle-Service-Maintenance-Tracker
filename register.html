<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleetSync - Register</title>

    <link rel="stylesheet" href="css/login.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <div class="login-container">

        <!-- Left Side Image -->
        <div class="login-image">
            <div class="overlay">
                <h1>FleetSync</h1>
                <p>Create your account and manage your vehicle services easily.</p>
            </div>
        </div>

        <!-- Register Form -->
        <div class="login-form-section">

            <h2>Create Account</h2>

            <p class="subtitle">
                Register to access FleetSync services
            </p>

            <form action="register.php" method="post">

                <div class="input-box">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="name" name="name" placeholder="Full Name" required>
                </div>

                <div class="input-box">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="email" name="email" placeholder="Email Address" required>
                </div>

                <div class="input-box">
                    <i class="fa-solid fa-phone"></i>
                    <input type="text" id="phone" name="phone" placeholder="Phone Number" required>
                </div>

                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" name="password" placeholder="Password" required>
                </div>

                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="confirmPassword" name="confirm_password" placeholder="Confirm Password"
                        required>
                </div>

                <div class="input-box">
                    <i class="fa-solid fa-location-dot"></i>
                    <input type="text" name="address" placeholder="Enter your address" required>
                </div>

                <button type="submit" name="register" class="login-btn">
                    Register
                </button>

            </form>

            <p class="back-home">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>

    </div>



</body>

</html>
